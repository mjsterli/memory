@switch (ShapeName) {
  @case ('triangle') {
    <svg width="100" height="100" viewBox="0 0 50 50">
      <polygon points="25,5 45,45 5,45" stroke="currentColor" strokeWidth="3" fill="none" />
    </svg>
  }

  @case ('square') {
    <svg width="100" height="100" viewBox="0 0 60 60">
      <rect x="5" y="5" width="50" height="50" stroke="currentColor" strokeWidth="3" fill="none" />
    </svg>
  }

  @case ('circle') {
    <svg width="100" height="100" viewBox="0 0 50 50">
      <circle cx="25" cy="25" r="20" stroke="currentColor" strokeWidth="3" fill="none" />
    </svg>
  }

  @case ('diamond') {
    <svg width="100" height="150" viewBox="0 0 100 150">
      <polygon points="50,10 90,75 50,140 10,75" fill="none" stroke="currentColor" strokeWidth="6" />
    </svg>
  }

  @case ('rectangle') {
    <svg width="110" height="60" viewBox="0 0 110 60">
      <rect x="10" y="10" width="90" height="40" fill="none" stroke="currentColor" strokeWidth="5" />
    </svg>
  }

  @case ('octogon') {
    <svg width="110" height="110" viewBox="0 0 100 100">
      <polygon points="30,10 70,10 90,30 90,70 70,90 30,90 10,70 10,30" fill="none" stroke="currentColor" strokeWidth="5" />
    </svg>
  }
}
